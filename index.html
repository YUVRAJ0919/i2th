<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dynamic AI 3D Tutor - Class 12</title>
    
    <!-- KaTeX for Physics/Math Formulas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
    
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <div id="app">
        <!-- Control Panel (Subject Selection & Voice) -->
        <div id="top-controls">
            <div class="control-group">
                <label for="subject-selector">Subject:</label>
                <select id="subject-selector">
                    <option value="physics">Physics</option>
                    <option value="chemistry">Chemistry</option>
                    <option value="maths">Mathematics</option>
                </select>
            </div>
            <button id="voice-toggle" class="voice-btn on">🔊 Voice: ON</button>
        </div>

        <!-- Flexible, Auto-Arranging Topics Grid -->
        <div id="quick-topics">
            <!-- Buttons will be injected here by app.js based on selected subject -->
        </div>

        <!-- 3D Canvas Area (Top half) -->
        <div id="canvas-container">
            <div id="loading-overlay" class="hidden">🤖 AI is preparing the lesson...</div>
            <div id="scene-label">No Topic Loaded</div>
        </div>
        
        <!-- Theory and Explanations Area (Bottom half) -->
        <div id="theory-container">
            <div id="chat-history">
                <div class="message system">
                    <h2>Live STEM Tutor</h2>
                    <p>Select a subject and topic from the menu above, or type a custom query. I will build the 3D model, teach you the theory out loud, and provide the derivations.</p>
                </div>
            </div>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Ask about any formula or topic...">
                <button id="send-btn">Learn</button>
            </div>
        </div>
    </div>

    <script type="module" src="/app.js"></script>
</body>
</html>
